<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Analytics Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 2em; }
    h1 { color: #333; max-width: 600px; margin: 0 auto 1em; }
    .nav-bar {
      background: white;
      padding: 15px 30px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      max-width: 600px;
      margin: 0 auto 2em;
    }
    .nav-bar a {
      color: #00796b;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .nav-bar a:hover {
      background: #f5f5f5;
      color: #004d40;
    }
    .nav-bar a.active {
      background: linear-gradient(135deg, #00796b 0%, #004d40 100%);
      color: white;
    }
    .metrics { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 2em; max-width: 600px; margin: auto; }
    .metric { margin-bottom: 1em; }
    .metric span { font-weight: bold; color: #0077cc; }
    .provider-list { margin-top: 1em; }
    .provider-list li { margin-bottom: 0.5em; }
    .latency { color: #666; font-size: 0.95em; }
    .auth { margin-bottom: 2em; max-width: 600px; margin: 0 auto 2em; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="admin-portal.html">🏠 Admin Portal</a>
    <a href="analytics.html" class="active">📊 Phase 1 Analytics</a>
    <a href="admin-ml-dashboard.html">🤖 AI/ML Dashboard</a>
    <a href="kb-admin.html">📚 KB</a>
    <a href="balance-upload.html">💰 Balance</a>
    <a href="admin.html">🛠️ Tools</a>
  </div>
  <h1>Chatbot Analytics Dashboard</h1>
  <div class="auth">
    <label for="token">Admin Token:</label>
    <input type="password" id="token" placeholder="Enter admin token">
    <button onclick="loadAnalytics()">Load Analytics</button>
  </div>
  <div class="metrics" id="metrics">
    <p>Enter your admin token and click "Load Analytics".</p>
  </div>
  <script>
    async function loadAnalytics() {
      const token = document.getElementById('token').value;
      const metricsDiv = document.getElementById('metrics');
      metricsDiv.innerHTML = '<p>Loading...</p>';
      try {
        const res = await fetch('/api/admin/analytics/summary', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) {
          metricsDiv.innerHTML = '<p style="color:red;">Unauthorized or error loading analytics.</p>';
          return;
        }
        const data = await res.json();
        metricsDiv.innerHTML = `
          <div class="metric">Total Sessions: <span>${data.totalSessions || 0}</span></div>
          <div class="metric">Total Messages: <span>${data.totalMessages || 0}</span></div>
          <div class="metric">Average Messages per Session: <span>${data.avgMessagesPerSession ? data.avgMessagesPerSession.toFixed(2) : '0'}</span></div>
          <div class="metric">Average Session Duration: <span>${data.avgSessionDuration ? data.avgSessionDuration.toFixed(2) : '0'} min</span></div>
          <div class="metric">Total Users: <span>${data.totalUsers || 0}</span></div>
          <div class="metric">Returning Users: <span>${data.returningUsers || 0}</span></div>
          <div class="metric">Average Satisfaction: <span>${data.avgSatisfaction ? data.avgSatisfaction.toFixed(2) : 'N/A'}</span></div>
        `;
      } catch (e) {
        metricsDiv.innerHTML = '<p style="color:red;">Error loading analytics.</p>';
      }
    }
  </script>
</body>
</html>
