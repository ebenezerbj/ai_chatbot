<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F4C81">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Amantin and Kasei Community Bank - Digital Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    /* AKCB HCI-Compliant Framework - Integrated into Live Chatbot */
    :root {
      /* Enhanced Professional Color System - AKCB Blue */
      --primary-color: #0F4C81;
      --primary-light: #1a5a96;
      --primary-dark: #0a3a5f;
      --primary-50: #eff6ff;
      --primary-100: #dbeafe;
      --primary-200: #bfdbfe;
      --primary-300: #93c5fd;
      --primary-400: #60a5fa;
      --primary-500: #3b82f6;
      --primary-600: #2563eb;
      --primary-700: #1d4ed8;
      --primary-800: #1e40af;
      --primary-900: #1e3a8a;
      
      --secondary-color: #f59e0b;
      --secondary-50: #fffbeb;
      --secondary-100: #fef3c7;
      --secondary-200: #fde68a;
      --secondary-300: #fcd34d;
      --secondary-400: #fbbf24;
      --secondary-500: #f59e0b;
      --secondary-600: #d97706;
      
      --success-color: #10b981;
      --success-50: #ecfdf5;
      --success-100: #d1fae5;
      --success-200: #a7f3d0;
      --success-600: #059669;
      --success-700: #047857;
      
      --error-color: #ef4444;
      --error-50: #fef2f2;
      --error-100: #fee2e2;
      --error-200: #fecaca;
      --error-600: #dc2626;
      
      --warning-color: #f59e0b;
      --warning-50: #fffbeb;
      --warning-100: #fef3c7;
      --warning-200: #fde68a;
      
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --white: #ffffff;
      
      /* Enhanced Typography & Spacing */
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 1.875rem;
      
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      
      /* Focus Ring for Accessibility */
      --focus-ring: 0 0 0 3px rgb(59 130 246 / 0.1);
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-touch-callout: none;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
      height: 100%;
      height: -webkit-fill-available;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, system-ui, sans-serif;
      background: linear-gradient(135deg, var(--gray-50) 0%, var(--gray-100) 100%);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      color: var(--gray-800);
      line-height: 1.65;
      overscroll-behavior: none;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    .app-container {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
    }

    .main-content {
      flex: 1;
      display: flex;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      padding: 0;
      overflow: hidden;
    }

    .chat-container {
      flex: 1;
      background: var(--white);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    .chat-header {
      background: linear-gradient(135deg, #0F4C81 0%, #1a5a96 100%);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      color: white;
      flex-shrink: 0;
      font-size: 0.9375rem;
    }

    .status-indicator {
      width: 0.5rem;
      height: 0.5rem;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .chat-title {
      font-weight: 500;
      font-size: 0.9375rem;
    }

    .chat-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.875rem;
      font-weight: 400;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-action-select {
      background: white;
      color: #333;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      cursor: pointer;
      outline: none;
    }

    .header-action-btn {
      background: transparent;
      color: white;
      border: none;
      padding: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      outline: none;
    }
    
    .header-action-btn:hover:not(:disabled) { 
      opacity: 0.85;
    }
    .header-action-btn:active:not(:disabled) {
      transform: translateY(0);
      background: var(--gray-100);
    }
    .header-action-btn:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }
    .header-action-btn:disabled {
      background: var(--gray-100);
      color: var(--gray-400);
      border-color: var(--gray-200);
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
      box-shadow: none;
    }
    .header-action-btn .label { 
      display: inline;
      font-weight: inherit;
    }
    
    /* Enhanced TTS button states */
    .tts-toggle-btn {
      transition: all 0.3s ease;
      position: relative;
    }
    
    .tts-toggle-btn[aria-pressed="true"] {
      background: var(--primary-color) !important;
      color: white !important;
      border-color: var(--primary-color) !important;
    }
    
    .tts-toggle-btn[aria-pressed="false"] {
      background: var(--gray-300) !important;
      color: var(--gray-600) !important;
      border-color: var(--gray-400) !important;
    }

    /* Assistance button styling */
    .assistance-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
      color: white !important;
      border: 1px solid #059669 !important;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
      transition: all 0.3s ease;
    }

    .assistance-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #059669 0%, #047857 100%) !important;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
      transform: translateY(-1px);
    }

    .assistance-btn svg {
      width: 20px;
      height: 20px;
    }
    
    .tts-stop-btn {
      background: var(--danger-color) !important;
      color: white !important;
      border-color: var(--danger-color) !important;
      animation: pulse 1.5s infinite;
    }
    
    .tts-stop-btn:hover {
      background: #dc2626 !important;
    }
    .header-action-select {
      background: var(--white);
      color: var(--gray-700);
      border: 1px solid var(--gray-300);
      border-radius: 10px;
      padding: 0.35rem 0.5rem;
      font-size: 0.85rem;
      max-width: 220px;
    }
  .tts-note { font-size: 0.8rem; color: var(--warning-color); }
    
    /* Ensure button text is always visible */
    .send-text {
      display: inline;
      font-weight: 500;
    }
    
    .header-action-btn .label {
      display: inline;
    }
    
    @media (max-width: 768px) {
      .header-action-btn .label { 
        display: none; 
      }
      .header-action-select { 
        max-width: 120px; 
      }
      
      /* Keep send button text visible on mobile */
      .send-text {
        display: inline !important;
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-800);
    }

    .chat-subtitle {
      font-size: 0.875rem;
      color: var(--gray-500);
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .session-timer {
      font-size: 0.75rem;
      color: var(--warning-color);
      font-weight: 600;
      padding: 0.125rem 0.5rem;
      background: var(--warning-50);
      border-radius: 12px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.5rem 1.5rem;
      background: #ffffff;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      min-height: 0;
    }

    .message {
      margin-bottom: 1rem;
      animation: messageSlideIn 0.3s ease-out;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--gray-500);
      font-style: italic;
      margin-bottom: 1rem;
      padding: 1rem 1.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      border-radius: 20px 20px 20px 4px;
      max-width: fit-content;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--gray-200);
    }

    .typing-dots {
      display: flex;
      gap: 0.35rem;
    }

    .typing-dot {
      width: 0.5rem;
      height: 0.5rem;
      background: #0F4C81;
      border-radius: 50%;
      animation: typingDot 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingDot {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      30% {
        transform: translateY(-8px);
        opacity: 1;
      }
    }

    .input-container {
      padding: 1rem 1.5rem;
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      max-width: 750px;
      margin: 0 auto;
    }

    .message-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0.875rem 1.125rem;
      font-size: 0.9375rem;
      font-family: inherit;
      background: #ffffff;
      transition: border-color 0.2s ease;
      resize: none;
      max-height: 140px;
      min-height: 44px;
      line-height: 1.5;
    }

    .message-input:focus {
      outline: none;
      border-color: #0F4C81;
      background: #ffffff;
    }

    .message-input::placeholder {
      color: #9ca3af;
      font-size: 0.9375rem;
    }

    .send-button {
      background: #0F4C81;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.875rem 2rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 44px;
      white-space: nowrap;
      outline: none;
    }

    .send-button:hover:not(:disabled) {
      background: #1a5a96;
    }

    .send-button:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(15, 76, 129, 0.3);
    }

    .send-button:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 2px;
    }

    .send-button:disabled {
      background: var(--gray-300);
      color: var(--gray-500);
      border-color: var(--gray-300);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      opacity: 0.6;
    }

    .icon-button {
      background: var(--white);
      color: var(--gray-700);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 0.75rem;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      text-decoration: none;
      outline: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    .icon-button:hover:not(:disabled) {
      background: var(--gray-50);
      border-color: var(--gray-300);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    
    .icon-button:active:not(:disabled) {
      transform: translateY(0);
      background: var(--gray-100);
    }
    
    .icon-button:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }
    
    .icon-button:disabled {
      background: var(--gray-100);
      color: var(--gray-400);
      border-color: var(--gray-200);
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
      box-shadow: none;
    }
    
    /* Size inline SVG icons consistently */
    .icon-button svg, .send-button svg {
      width: 1rem;
      height: 1rem;
      display: inline-block;
      fill: currentColor;
    }
    
    /* Ensure all button text elements are visible */
    button span, .btn span, .send-text, .label, .button-text {
      display: inline !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    /* HCI Typography Scale */
    .text-xs { font-size: var(--text-xs); line-height: 1.4; }
    .text-sm { font-size: var(--text-sm); line-height: 1.5; }
    .text-base { font-size: var(--text-base); line-height: 1.6; }
    .text-lg { font-size: var(--text-lg); line-height: 1.6; }
    .text-xl { font-size: var(--text-xl); line-height: 1.5; }
    .text-2xl { font-size: var(--text-2xl); line-height: 1.4; }

    /* Enhanced Accessibility Features */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus Management */
    *:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    /* Touch Target Enhancement */
    @media (pointer: coarse) {
      .header-action-btn, .icon-button, .send-button {
        min-height: 48px;
        min-width: 48px;
        padding: 0.875rem 1.25rem;
      }
    }

    /* High Contrast Mode Support */
    @media (prefers-contrast: high) {
      .header-action-btn, .icon-button {
        border-width: 2px;
      }
      .send-button {
        border-width: 2px;
        background: var(--primary-color);
      }
    }

    /* Reduced Motion Support */
    @media (prefers-reduced-motion: reduce) {
      .header-action-btn, .icon-button, .send-button, .info-card {
        transition: none;
      }
      .header-action-btn:hover, .icon-button:hover, .send-button:hover {
        transform: none;
      }
    }

    .sidebar {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .info-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
      transition: all 0.2s ease;
    }

    .info-card.clickable {
      cursor: pointer;
    }

    .info-card.clickable:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-xl);
    }

    .info-card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .info-card-icon {
      width: 2rem;
      height: 2rem;
      background: var(--primary-color);
      color: var(--white);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-800);
    }

    .info-list {
      list-style: none;
    }

    .info-item {
      padding: 0.5rem 0;
      color: var(--gray-600);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-item i {
      color: var(--success-color);
      width: 1rem;
    }

    /* Legacy classes for compatibility */
    .msg {
      margin-bottom: 1.5rem;
    }

    .user {
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .user .msg-content {
      background: #0F4C81;
      color: white;
      padding: 0.875rem 1.25rem;
      border-radius: 16px 16px 2px 16px;
      max-width: 70%;
      font-size: 0.9375rem;
      line-height: 1.5;
      position: relative;
      word-wrap: break-word;
      border-left: 3px solid #1a5a96;
    }

    .assistant {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .assistant .msg-content {
      background: #f8f9fa;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-radius: 16px 16px 16px 2px;
      white-space: pre-wrap;
      padding: 0.875rem 1.25rem;
      max-width: 75%;
      font-size: 0.9375rem;
      line-height: 1.55;
      word-wrap: break-word;
      overflow-wrap: break-word;
      position: relative;
      border-left: 3px solid #0F4C81;
      flex-shrink: 1;
    }

    .message-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
      margin-left: auto;
      flex-shrink: 0;
    }

    .message-timestamp {
      font-size: 0.6875rem;
      color: #9ca3af;
      white-space: nowrap;
    }

    .user .message-timestamp {
      text-align: right;
    }

    .assistant .message-timestamp {
      text-align: left;
    }

    /* Action buttons row (e.g., Call / WhatsApp) appended to assistant messages */
    .msg-actions {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Phase 2: Feedback buttons */
    .message-feedback {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      align-items: center;
    }

    .feedback-btn {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 0.75rem;
      transition: all 0.2s ease;
      width: 2.25rem;
      height: 2.25rem;
    }

    .feedback-btn:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    .feedback-btn.active {
      background: #0F4C81;
      border-color: #0F4C81;
      color: white;
    }

    .feedback-btn.thumbs-down.active {
      background: #ef4444;
      border-color: #ef4444;
    }

    .feedback-btn svg {
      width: 14px;
      height: 14px;
    }

    .feedback-thanks {
      font-size: 0.85rem;
      color: var(--teal);
      margin-left: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }

  <div class="app-container">

  <script>
    // Configure the chatbot's human-friendly name here
  const assistantName = 'Ama';
  // Show Call/WhatsApp action buttons on desktop too? (true = all devices)
  const showContactActionsOnDesktop = true;
  // Text-to-Speech (TTS) configuration
  let ttsEnabled = JSON.parse(localStorage.getItem('ttsEnabled') || 'true');
  let currentUtterance = null;
  let ttsVoiceName = localStorage.getItem('ttsVoiceName') || '';
  let ttsLangPref = localStorage.getItem('ttsLangPref') || 'female-uk'; // 'auto' | 'female-uk' | 'twi' | 'french'
  let ttsForceServer = JSON.parse(localStorage.getItem('ttsForceServer') || 'false');
  const ttsToggleBtn = document.getElementById('ttsToggle');
  const ttsStopBtn = document.getElementById('ttsStop');
  const ttsSelect = document.getElementById('ttsSelect');
  const ttsNote = document.getElementById('ttsNote');
    const chatEl = document.getElementById('chat');
    const form = document.getElementById('composer');
    const input = document.getElementById('input');
    const sendButton = form.querySelector('button[type="submit"]');
    const sendButtonText = sendButton.querySelector('.send-text');
  const useLocationBtn = document.getElementById('useLocationBtn');

    let sessionId = null;

    // ===== Session Idle Timeout Management =====
    const IDLE_TIMEOUT = 5 * 60 * 1000; // 5 minutes
    const WARNING_TIME = 4 * 60 * 1000; // Show warning at 4 minutes
    let lastActivityTime = Date.now();
    let idleWarningShown = false;
    let idleCheckInterval = null;

    function resetIdleTimer() {
      lastActivityTime = Date.now();
      idleWarningShown = false;
      
      // Hide timer when activity detected
      const timerEl = document.getElementById('sessionTimer');
      if (timerEl) timerEl.style.display = 'none';
    }

    function checkIdleTimeout() {
      const idleTime = Date.now() - lastActivityTime;
      const remainingTime = IDLE_TIMEOUT - idleTime;
      const remainingMinutes = Math.ceil(remainingTime / 60000);
      
      // Update session timer display
      const timerEl = document.getElementById('sessionTimer');
      if (timerEl) {
        if (idleTime >= WARNING_TIME) {
          timerEl.textContent = `${remainingMinutes}m`;
          timerEl.style.display = 'inline-block';
        } else {
          timerEl.style.display = 'none';
        }
      }
      
      // Show warning at 13 minutes
      if (idleTime >= WARNING_TIME && !idleWarningShown) {
        idleWarningShown = true;
        addMsg('assistant', '⏰ Your session will expire in 2 minutes due to inactivity. Send a message to keep it active.');
      }
      
      // Expire session at 15 minutes
      if (idleTime >= IDLE_TIMEOUT) {
        expireSession();
      }
    }

    async function expireSession() {
      // Hide session timer
      const timerEl = document.getElementById('sessionTimer');
      if (timerEl) timerEl.style.display = 'none';
      
      // End analytics session on the backend
      if (sessionId) {
        try {
          await fetch('/api/session/end', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId })
          });
          console.log('[Analytics] Session ended on server');
        } catch (e) {
          console.error('[Analytics] Failed to end session:', e);
        }
      }
      
      // Clear session
      sessionId = null;
      
      // Clear chat messages except welcome
      const messages = chatEl.querySelectorAll('.message');
      messages.forEach(msg => msg.remove());
      
      // Show expiration message
      addMsg('assistant', '🔒 Your session has expired due to inactivity.\n\nFor your security, the conversation has been cleared.\n\nHow can I assist you today?');
      
      // Reset idle tracking
      resetIdleTimer();
      idleWarningShown = false;
      
      console.log('[Session] Expired due to inactivity');
    }

    function startIdleTracking() {
      // Track user activity
      const activityEvents = ['click', 'keypress', 'touchstart', 'scroll'];
      activityEvents.forEach(event => {
        document.addEventListener(event, resetIdleTimer, { passive: true });
      });
      
      // Check idle status every 30 seconds
      idleCheckInterval = setInterval(checkIdleTimeout, 30000);
    }

    // Initialize with welcome message
    window.addEventListener('DOMContentLoaded', async () => {
      // Set the chat title to the assistant's name
      const titleEl = document.querySelector('.chat-title');
      if (titleEl) titleEl.textContent = assistantName;

      // Fetch personalized greeting (Phase 2)
      let welcomeMessage = `Welcome to Amantin and Kasei Community Bank! 👋\n\nAre you a customer of AKCB?`;
      let welcomeButtons = [
        { text: 'Yes - I\'m a customer', action: 'send', value: 'Yes, I am a customer of AKCB' },
        { text: 'No - General inquiry', action: 'send', value: 'No, I have a general inquiry' },
        { text: '🆘 Assistance', action: 'handover', value: 'assistance' }
      ];
      try {
        const greetingResp = await fetch('/api/greeting', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });
        if (greetingResp.ok) {
          const greetingData = await greetingResp.json();
          
          // Store session ID from server
          if (greetingData.sessionId) {
            sessionId = greetingData.sessionId;
            console.log('[Session] Initialized with ID:', sessionId);
          }
          
          if (greetingData.greeting) {
            welcomeMessage = greetingData.greeting;
          }
          if (greetingData.buttons) {
            welcomeButtons = greetingData.buttons;
          }
          // Show recommendations if available
          if (greetingData.recommendations && greetingData.recommendations.length > 0) {
            setTimeout(() => {
              const recs = greetingData.recommendations.map(r => `• ${r.title}: ${r.description}`).join('\n');
              addMsg('assistant', `💡 Based on your previous visits, you might be interested in:\n\n${recs}`);
            }, 1000);
          }
          // Show pending follow-ups
          if (greetingData.followUps && greetingData.followUps.length > 0) {
            setTimeout(() => {
              const followUps = greetingData.followUps.map(f => `• ${f.topic}: ${f.action}`).join('\n');
              addMsg('assistant', `📋 You have pending actions:\n\n${followUps}\n\nWould you like to continue with any of these?`);
            }, 2000);
          }
        }
      } catch (e) {
        console.log('[Greeting] Using default greeting');
      }
      
      addMsg('assistant', welcomeMessage, {
        buttons: welcomeButtons
      });
      
      // Init TTS UI state
      initTTS();
      
      // Start idle timeout tracking
      startIdleTracking();
      
      // Notify parent that the chat is ready (for iframed embedding)
      try { window.parent?.postMessage({ source: 'akcb-chat', type: 'ready' }, '*'); } catch {}
    });

    async function ensureSession() {
      if (sessionId) return sessionId;
      try {
        const resp = await fetch('/api/session', { method: 'POST' });
        if (!resp.ok) throw new Error('Failed to create session');
        const data = await resp.json();
        sessionId = data.sessionId;
        console.log('[DEBUG] Created new session:', sessionId);
        return sessionId;
      } catch (error) {
        console.error('Session creation failed:', error);
        throw error;
      }
    }

  function addMsg(role, text, options = {}) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      
      const content = document.createElement('div');
      content.className = 'msg-content';
      
      // Normalize assistant text to display literal \n as real line breaks
      const normalize = (s) => {
        try {
          return String(s)
            .replace(/\\r\\n/g, '\n')
            .replace(/\\n/g, '\n')
            .replace(/\\t/g, '    ');
        } catch {
          return s;
        }
      };
      const processed = role === 'assistant' ? normalize(text) : text;

      // Minimal, safe markdown renderer for assistant messages: **bold**, - bullets, numbered lists
      function renderMarkdownSafe(input) {
        const escapeHtml = (str) => str
                .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');

        // Process markdown links FIRST, before any escaping
        let text = String(input);
        const linkPlaceholders = [];
        
        // Extract markdown links and create unique placeholders
        text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, linkText, url) => {
          const placeholder = `__MDLINK${linkPlaceholders.length}MDLINK__`;
          linkPlaceholders.push({ text: escapeHtml(linkText), url: url });
          console.log('[Markdown] Extracted link:', linkText, '→', url);
          return placeholder;
        });

        const applyInline = (str) => {
          // First, restore markdown links to markers (don't escape placeholders!)
          let out = str.replace(/__MDLINK(\d+)MDLINK__/g, (match, index) => {
            const link = linkPlaceholders[parseInt(index)];
            if (link) {
              console.log('[Markdown] Restoring link:', link.text, '→', link.url);
              // Return a unique marker that won't be escaped
              return `%%LINK${index}%%`;
            }
            return match;
          });
          
          // NOW escape HTML for the rest of the content
          out = escapeHtml(out);
          
          // Bold: **text**
          out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
          
          // Auto-link plain URLs BEFORE inserting markdown links (skip markers)
          out = out.replace(/\b(https?:\/\/[^\s<)]+)(?=[)\s]|$)/g, (m, url) => {
            // Skip if this is part of our link marker
            if (m.includes('%%LINK') || m.includes('MDLINK')) return m;
            try {
              const safeUrl = url.replace(/&amp;/g, '&'); // Unescape URLs that got escaped
              return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            } catch { return url; }
          });
          
          // FINALLY replace markers with actual HTML links (after auto-linking is done)
          out = out.replace(/%%LINK(\d+)%%/g, (match, index) => {
            const link = linkPlaceholders[parseInt(index)];
            if (link) {
              return `<a href="${link.url}" target="_blank" rel="noopener noreferrer" style="color: #007bff; text-decoration: underline;">${link.text}</a>`;
            }
            return match;
          });
          
          return out;
        };

        const src = text;

        let out = '';
        let listType = null; // 'ul' | 'ol' | null

        const closeList = () => {
          if (listType) {
            out += listType === 'ul' ? '</ul>' : '</ol>';
            listType = null;
          }
        };

        for (let i = 0; i < lines.length; i++) {
          const raw = lines[i];

            if (i < lines.length - 1) out += '<br />';
          }
        }

        closeList();

    function isTTSSupported() {

    function getVoicesSafe() {

    function isTwiVoice(v) {
      try {
        const ln = (v.lang || '').toLowerCase();
        const nm = (v.name || '').toLowerCase();
        return /^(ak|tw)(-|_|$)/.test(ln) || /ak-?gh/.test(ln) || /twi|akan/.test(nm);
      } catch { return false; }
    }

    function isFrenchVoice(v) {
      try {
        const ln = (v.lang || '').toLowerCase();
        const nm = (v.name || '').toLowerCase();
        return /^fr(-|_|$)/.test(ln) || /french|française?/i.test(nm);
      } catch { return false; }
    }

    function isFemaleUKVoice(v) {
      try {
        const ln = (v.lang || '').toLowerCase();
        const nm = (v.name || '').toLowerCase();
        // Check for UK English variants and female names
        const isUKLang = /en-gb|en-uk/i.test(ln) || /british|uk/i.test(nm);
        const isFemale = /female|woman|girl|kate|emma|amy|susan|claire|serena|karen|samantha|victoria|alice/i.test(nm);
        return isUKLang && isFemale;
      } catch { return false; }
    }

    function pickVoice() {
      const voices = getVoicesSafe();
      if (!voices.length) return null;
      if (ttsVoiceName) {
        const v = voices.find(v => v.name === ttsVoiceName);
        if (v) return v;
      }
      
      // Language preference ordering
      if (ttsLangPref === 'twi') {
        const tw = voices.find(v => isTwiVoice(v));
        if (tw) return tw;
      }
      
      if (ttsLangPref === 'french') {
        const fr = voices.find(v => isFrenchVoice(v));
        if (fr) return fr;
        // Fallback to any French voice
        const frGeneral = voices.find(v => /fr/i.test(v.lang || ''));
        if (frGeneral) return frGeneral;
      }
      
      if (ttsLangPref === 'female-uk') {
        const femaleUK = voices.find(v => isFemaleUKVoice(v));
        if (femaleUK) return femaleUK;
        // Fallback to any UK English voice
        const ukVoice = voices.find(v => /en-gb|en-uk/i.test(v.lang || '') || /british|uk/i.test(v.name || ''));
        if (ukVoice) return ukVoice;
        // Fallback to any female English voice
        const femaleEn = voices.find(v => /en/i.test(v.lang || '') && /female|woman|girl|kate|emma|amy|susan|claire|serena|karen|samantha|victoria|alice/i.test(v.name || ''));
        if (femaleEn) return femaleEn;
      }
      
      if (ttsLangPref === 'auto' || ttsLangPref === 'female-uk') {
        // For auto, prefer Female UK, then Ghana English, then any English
        const femaleUK = voices.find(v => isFemaleUKVoice(v));
        if (femaleUK) return femaleUK;
        const enGh = voices.find(v => /en-?gh/i.test((v.lang||'')) || /ghana/i.test((v.name||'')));
        if (enGh) return enGh;
        const en = voices.find(v => /en[-_]/i.test(v.lang));
        if (en) return en;
      }
      
      return voices[0];
    }

        console.error('OpenAI TTS failed:', e);
      }
      
      // Last resort: browser TTS fallback
      stopSpeaking();
      const utter = new SpeechSynthesisUtterance(clean);
      const v = pickVoice();
      if (v) utter.voice = v;
      try {
        if (v?.lang) {
          utter.lang = v.lang;
        } else if (ttsLangPref === 'twi') {
          utter.lang = 'ak-GH';
        } else if (ttsLangPref === 'french') {
          utter.lang = 'fr-FR';
        } else if (ttsLangPref === 'female-uk') {
          utter.lang = 'en-GB';
        } else {
          utter.lang = 'en-GB'; // Default to UK English
        }
      } catch {}
      utter.rate = 1.0; utter.pitch = 1.0;
      utter.onstart = () => { currentUtterance = utter; updateTTSButtons(); };
      utter.onend = () => { currentUtterance = null; updateTTSButtons(); };
      utter.onerror = () => { currentUtterance = null; updateTTSButtons(); };
      try { window.speechSynthesis.speak(utter); } catch {}
    }

  function stopSpeaking() {
      try {
    if (currentUtterance && currentUtterance.kind === 'audio' && currentUtterance.audio) { try { currentUtterance.audio.pause(); } catch {} }
    if (window.speechSynthesis?.speaking || window.speechSynthesis?.pending) { window.speechSynthesis.cancel(); }
      } finally {
        currentUtterance = null;
        updateTTSButtons();
      }
    }

    function addSpeakAction(containerEl, text) {

    function initTTS() {
      updateTTSButtons();

      if (isTTSSupported()) {
        try { window.speechSynthesis.onvoiceschanged = () => { refreshCombinedTTSOptions(); updateTTSButtons(); }; } catch { /* ignore */ }
      }
      
      // Mobile audio context unlock - initialize audio on first user interaction
      let audioUnlocked = false;
      const unlockAudio = () => {
        if (audioUnlocked) return;
        // Create a silent audio to unlock audio playback on iOS/Android
        const silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
        silentAudio.play().then(() => {
          audioUnlocked = true;
          console.log('Audio unlocked for mobile');
        }).catch(() => {
          // Silently fail - will try again on next interaction
        });
      };
      
      // Unlock audio on any user interaction (for mobile)
      document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
      document.addEventListener('click', unlockAudio, { once: true, passive: true });
      
      // Wire header buttons
      ttsToggleBtn?.addEventListener('click', () => {
        unlockAudio(); // Ensure audio is unlocked
        ttsEnabled = !ttsEnabled;
        localStorage.setItem('ttsEnabled', JSON.stringify(!!ttsEnabled));

        }

    function refreshCombinedTTSOptions() {
      if (!ttsSelect) return;
      if (!isTTSSupported()) { ttsSelect.style.display = 'none'; return; }
      const voices = getVoicesSafe();
      const shouldBuild = !ttsSelect.options.length || (ttsSelect._lastCount !== voices.length);
      if (shouldBuild) {
        ttsSelect.innerHTML = '';
        const core = [
          { v: 'auto', label: 'Auto' },
          { v: 'twi-server', label: 'Ghana Twi' },
          { v: 'french', label: 'French' },
          { v: 'female-uk', label: 'Female UK' }
        ];
        for (const o of core) {
          const el = document.createElement('option');
          el.value = o.v; el.textContent = o.label; ttsSelect.appendChild(el);
        }
        const twiVoices = voices.filter(v => isTwiVoice(v));
        for (const v of twiVoices) {
          const el = document.createElement('option');
          el.value = `voice::${v.name}`;
          el.textContent = `Twi — ${v.name} (${v.lang})`;
          ttsSelect.appendChild(el);
        }
        
        // Add French voices
        const frenchVoices = voices.filter(v => isFrenchVoice(v) && !isTwiVoice(v));
        for (const v of frenchVoices) {
          const el = document.createElement('option');
          el.value = `voice::${v.name}`;
          el.textContent = `French — ${v.name} (${v.lang})`;
          ttsSelect.appendChild(el);
        }
        
        // Add Female UK voices
        const femaleUKVoices = voices.filter(v => isFemaleUKVoice(v) && !isTwiVoice(v) && !isFrenchVoice(v));
        for (const v of femaleUKVoices) {
          const el = document.createElement('option');
          el.value = `voice::${v.name}`;
          el.textContent = `Female UK — ${v.name} (${v.lang})`;
          ttsSelect.appendChild(el);
        }
        
        // Add other voices
        const others = voices.filter(v => !isTwiVoice(v) && !isFrenchVoice(v) && !isFemaleUKVoice(v)).sort((a,b)=>a.name.localeCompare(b.name));
        for (const v of others) {
          const el = document.createElement('option');
          el.value = `voice::${v.name}`;
          el.textContent = `Other — ${v.name} (${v.lang})`;
          ttsSelect.appendChild(el);
        }
        ttsSelect._lastCount = voices.length;
      }
      let val = 'female-uk'; // Default to Female UK
      if (ttsLangPref === 'twi' && ttsForceServer) val = 'twi-server';
      else if (ttsLangPref === 'auto') val = 'auto';
      else if (ttsLangPref === 'french') val = 'french';
      else if (ttsLangPref === 'female-uk') val = 'female-uk';
      else if (ttsVoiceName) val = `voice::${ttsVoiceName}`;
      ttsSelect.value = val;
      ttsSelect.style.display = 'inline-block';
      if (!ttsSelect._wired) {
        ttsSelect.addEventListener('change', () => {
          const value = ttsSelect.value || 'female-uk';
          if (value === 'auto') {
            ttsLangPref = 'auto'; ttsVoiceName = ''; ttsForceServer = false;
          } else if (value === 'female-uk') {
            ttsLangPref = 'female-uk'; ttsVoiceName = ''; ttsForceServer = false;
          } else if (value === 'french') {
            ttsLangPref = 'french'; ttsVoiceName = ''; ttsForceServer = false;
          } else if (value === 'twi-server') {
            ttsLangPref = 'twi'; ttsVoiceName = ''; ttsForceServer = true;
          } else if (value.startsWith('voice::')) {
            ttsVoiceName = value.slice('voice::'.length);
            ttsLangPref = 'auto'; ttsForceServer = false;
          }
          localStorage.setItem('ttsLangPref', ttsLangPref);
          localStorage.setItem('ttsVoiceName', ttsVoiceName);
          localStorage.setItem('ttsForceServer', JSON.stringify(!!ttsForceServer));
          updateTTSNote();
          if (currentUtterance) {
            const nodes = Array.from(chatEl.querySelectorAll('.message.assistant .msg-content'));
            const last = nodes[nodes.length - 1];
            const txt = last?.textContent || '';
            if (txt.trim()) speak(txt);
          }
        });
        ttsSelect._wired = true;
      }
    }

    function updateTTSNote() {
      if (!ttsNote) return;
  const voices = getVoicesSafe();
  const anyTwi = voices.some(v => isTwiVoice(v));
  const showWarn = ttsLangPref === 'twi' && (ttsForceServer || !anyTwi);
      if (showWarn) {
  ttsNote.textContent = 'No Twi/Akan voice found on this device. I\'ll use server TTS (Azure/eSpeak) instead.';
        ttsNote.style.display = 'inline';
      } else {
        ttsNote.textContent = '';

    // Detect mobile devices (simple UA check)
    function isMobileDevice() {
      const ua = navigator.userAgent || navigator.vendor || window.opera || '';
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
    }

    // Extract the first Ghana-style phone number from text and build tel/whatsapp links
    function parsePhoneLinks(raw) {
      if (!raw) return null;
      // Match +233 XX XXX XXXX or 0XX XXX XXXX, as well as compact variants (e.g., 0202055171)
      const re = /(\+233[\s\-]?(?:\d[\s\-]?){9,10}|\b0\d{2}[\s\-]?\d{3}[\s\-]?\d{4}\b|\b0\d{9}\b)/;
      const m = raw.match(re);
      if (!m) return null;
      let display = (m[0] || '').trim().replace(/[\.,]+$/, '');
      // Normalize
      const digitsPlus = display.replace(/[^\d+]/g, '');
      let tel = digitsPlus;
      let wa = '';
      if (/^\+233/.test(digitsPlus)) {
        wa = digitsPlus.replace(/^\+/, '');
      } else if (/^0\d{9}$/.test(digitsPlus)) {
        // Convert local (0XXXXXXXXX) to E.164 for WA
        wa = '233' + digitsPlus.slice(1);
        // tel can keep local format (better compatibility in GH)
        tel = digitsPlus;
      } else if (/^233\d{9}$/.test(digitsPlus)) {
        // Already international without +
        tel = '+' + digitsPlus;
        wa = digitsPlus;
      } else if (/^\+\d{6,}$/.test(digitsPlus)) {
        // Fallback: generic international
        tel = digitsPlus;
        wa = digitsPlus.replace(/^\+/, '');
      } else {
        // Couldn’t confidently parse
        return null;
      }
      return {
        display,
        telHref: `tel:${tel}`,
        waHref: `https://wa.me/${wa}`
      };
    }

    // Append Call / WhatsApp buttons below assistant messages when applicable
    function addMobileContactActionsIfAny(containerEl, messageText) {

  async function sendMessage(message) {
      const msgText = (message || input.value).trim();
      if (!msgText) return;

      // If user asks for the nearest branch, auto-request geolocation and handle locally
      try {
        const isNearestBranchQuery = (s) => {
          const t = s.toLowerCase();
          return (
            /\b(where\s+(is|'s)\s+(the\s+)?)?(nearest|closest)\s+(branch|bank)(\s+(to\s+me|near\s+me))?\b/i.test(t) ||
            /\b(find|show|get)\s+(me\s+)?(the\s+)?(nearest|closest)\s+(branch|bank)\b/i.test(t) ||
            /\bnearest\s+(branch|bank)\b/i.test(t)
          );
        };
        if (isNearestBranchQuery(msgText)) {
          // Echo user message and request location
          input.value = '';
          input.style.height = 'auto';
          addMsg('user', msgText);
          if (!('geolocation' in navigator)) {
            addMsg('assistant', 'Geolocation is not supported by your browser. Please use the crosshair button or enter a GhanaPost plus code (e.g., QQJG+P27).');
            return;
          }
          addMsg('assistant', 'Requesting your location…');
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              const { latitude, longitude } = pos.coords;
              await callNearestBranch({ lat: latitude, lng: longitude });
            },
            (err) => {
              console.error('geo error', err);
              addMsg('assistant', 'I could not access your location. Please allow location access, use the crosshair button, or share a GhanaPost plus code.');
            },
            { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
          );
          return; // handled locally
        }
      } catch (e) { /* non-fatal */ }

      // If user replies "yes" after a directions prompt, auto-request geolocation
      try {
        const getLastAssistantText = () => {
          const nodes = Array.from(chatEl.querySelectorAll('.message.assistant .msg-content'));
          if (!nodes.length) return '';
          return nodes[nodes.length - 1].textContent || '';
        };
        const lastAssistant = (getLastAssistantText() || '');
        const askedForDirections = /need directions from your location\?/i.test(lastAssistant);
        const affirmative = /^\s*(yes|yeah|yep|sure|ok|okay)\s*\.?$/i.test(msgText);
        if (askedForDirections && affirmative) {
          // Clear input and echo user's confirmation
          input.value = '';
          input.style.height = 'auto';
          addMsg('user', msgText);

          if (!('geolocation' in navigator)) {
            addMsg('assistant', 'Geolocation is not supported by your browser. Please enter a GhanaPost plus code instead.');
            return;
          }
          addMsg('assistant', 'Requesting your location…');
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              const { latitude, longitude } = pos.coords;
              await callNearestBranch({ lat: latitude, lng: longitude });
            },
            (err) => {
              console.error('geo error', err);
              addMsg('assistant', 'I could not access your location. You can enter a GhanaPost plus code instead.');
            },
            { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
          );
          return; // Do not forward this to the chat backend
        }
      } catch (e) {
        // Non-fatal
      }
      
      // Reset idle timer on message send
      resetIdleTimer();
      
      input.value = '';
      input.style.height = 'auto'; // Reset height
      sendButton.disabled = true;
      
      addMsg('user', msgText);
      showTyping();

      try {
        const sid = await ensureSession();
        
        // Count messages to determine index
        const messageCount = chatEl.querySelectorAll('.message').length;
        
        const makeCall = async () => {
          const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              sessionId: sid, 
              message: msgText,
              messageIndex: messageCount
            })
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          return resp.json();
        };
        let data;
        try {
          data = await makeCall();
        } catch (e1) {
          // brief retry for transient issues
          await new Promise(r => setTimeout(r, 300));
          data = await makeCall();
        }
        hideTyping();
        console.log('[DEBUG] Response data:', JSON.stringify(data));
        console.log('[DEBUG] data?.reply:', data?.reply);
        
        // Handle new button/dropdown format
        const messageText = data?.response || data?.reply;
        const messageOptions = {};
        
        if (data?.buttons) {
          messageOptions.buttons = data.buttons;
        }
        if (data?.dropdown) {
          messageOptions.dropdown = data.dropdown;
          messageOptions.dropdownPlaceholder = data.dropdownPlaceholder;
        }
        
        if (messageText) {
          addMsg('assistant', messageText, messageOptions);
          try {
            if (data?.openLoanApplicationForm) {
              setTimeout(() => {
                openLoanApplicationForm();
              }, 100);
            }
          } catch {}
          try {
            if (data?.openAccountOpeningForm) {
              setTimeout(() => {
                openAccountOpeningForm();
              }, 100);
            }
          } catch {}
          try {
            if (data.suggestHandover) {
              // Check if user just said "yes" to a handover question
              const lastMessages = chatEl.querySelectorAll('.message');
              const lastAssistantMsg = Array.from(lastMessages).slice(-3).find(msg => 
                msg.classList.contains('assistant') && 
                msg.textContent.includes('Would you like me to facilitate a connection with a customer representative')
              );
              const userJustSaidYes = lastAssistantMsg && 
                /^(yes|yeah|yep|sure|ok|okay|y|please|connect me|help me)$/i.test(msgText.trim());
              
              if (userJustSaidYes) {
                // User confirmed they want handover - open form directly
                setTimeout(() => {
                  openHandoverForm();
                }, 100);
              } else {
                // Check if the reply already contains the handover question
                const replyContainsHandover = data.reply.includes('Would you like me to facilitate a connection with a customer representative');
                
                if (!replyContainsHandover) {
                  // Only add handover message if not already in the reply
                  addMsg('assistant', 'I appreciate your inquiry; however, this matter lies outside of my expertise. Would you like me to facilitate a connection with a customer representative who can provide the necessary assistance?');
                }
                renderHandoverCTA();
              }
            }
          } catch {}
        } else {
          addMsg('assistant', 'I\'m having some technical difficulties right now. Let me connect you with one of our human agents who can help you immediately.');
          setTimeout(() => {
            renderHandoverCTA();
          }, 100);
        }
      } catch (error) {
        hideTyping();
        console.error('Chat error:', error);
        addMsg('assistant', 'I\'m having some technical difficulties right now. Let me connect you with one of our human agents who can help you immediately.');
        // Automatically trigger handover when there's a connection error
        setTimeout(() => {
          renderHandoverCTA();
        }, 100);
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    function renderHandoverCTA() {
      // Append a compact CTA to the last assistant message
      const nodes = Array.from(chatEl.querySelectorAll('.message.assistant .msg-content'));
      if (!nodes.length) return;
      const last = nodes[nodes.length - 1];

      })();

      row.appendChild(btn);

    function isWithinWorkingHours() {
      const now = new Date();
      const day = now.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const timeInMinutes = hours * 60 + minutes;
      
      // Check if it's a weekday (Monday-Friday)
      const isWeekday = day >= 1 && day <= 5;
      
      // Check if it's between 8:30 AM (510 minutes) and 4:00 PM (960 minutes)
      const workingStart = 8 * 60 + 30; // 8:30 AM
      const workingEnd = 16 * 60; // 4:00 PM
      const isDuringWorkingHours = timeInMinutes >= workingStart && timeInMinutes < workingEnd;
      
      return isWeekday && isDuringWorkingHours;
    }

        const amt = Number((loanAmountEl?.value || '').toString().replace(/,/g, ''));
        const tenor = Number((loanTenorEl?.value || '').toString().replace(/,/g, ''));
        if (!Number.isFinite(amt) || amt <= 0 || !Number.isFinite(tenor) || tenor <= 0) {
          if (monthlyEl) monthlyEl.value = '';
          return;
        }
        const monthly = Math.round((amt / tenor) * 100) / 100;
        if (monthlyEl) monthlyEl.value = `GHS ${monthly.toFixed(2)}`;
      };

      loanAmountEl?.addEventListener('input', recalc);
      loanTenorEl?.addEventListener('input', recalc);

      const getField = (id) => wrap.querySelector(`#${id}`);
      const setValue = (id, value) => {
        const el = getField(id);
        if (!el) return;
        if (typeof value === 'undefined' || value === null) return;

      const setChecked = (id, value) => {
        const el = getField(id);
        if (!el) return;
        el.checked = !!value;
      };

        const raw = localStorage.getItem(DRAFT_KEY);

          setValue('loanPhone', d.phoneNumber);
          setValue('loanNationalId', d.nationalIdNumber);
          setValue('loanAccountNumber', d.accountNumber);
          setValue('loanEmployer', d.employerName);
          setValue('loanPosition', d.position);
          setValue('loanEmploymentType', d.employmentType);
          setValue('loanLengthService', d.lengthOfService);
          setValue('loanNetSalary', d.netMonthlySalary);
          setValue('loanAmount', d.loanAmount);
          setValue('loanPurpose', d.loanPurpose);
          setValue('loanTenor', d.loanTenorMonths);
          setChecked('loanSalaryDeduction', d.salaryDeductionConsent);
          setChecked('loanEmployerConfirmation', d.employerConfirmation);
          setChecked('loanBorrowerDeclaration', d.borrowerDeclaration);
        }

      const persistDraft = () => {
        try {
          const readVal = (id) => {
            const el = getField(id);
            return el ? (el.value || '') : '';
          };
          const readChecked = (id) => {
            const el = getField(id);
            return !!(el && el.checked);
          };
          const draft = {
            fullName: readVal('loanFullName'),
            phoneNumber: readVal('loanPhone'),
            nationalIdNumber: readVal('loanNationalId'),
            accountNumber: readVal('loanAccountNumber'),
            employerName: readVal('loanEmployer'),
            position: readVal('loanPosition'),
            employmentType: readVal('loanEmploymentType'),
            lengthOfService: readVal('loanLengthService'),
            netMonthlySalary: readVal('loanNetSalary'),
            loanAmount: readVal('loanAmount'),
            loanPurpose: readVal('loanPurpose'),
            loanTenorMonths: readVal('loanTenor'),
            salaryDeductionConsent: readChecked('loanSalaryDeduction'),
            employerConfirmation: readChecked('loanEmployerConfirmation'),
            borrowerDeclaration: readChecked('loanBorrowerDeclaration')
          };
          localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
        } catch {}
      };

      wrap.addEventListener('input', persistDraft);
      wrap.addEventListener('change', persistDraft);

      // Trigger first recalculation after draft restore.
      try { recalc(); } catch {}
    }

    async function submitLoanApplication(wrapElement) {
      if (!wrapElement) {
        console.error('[LoanApp] No wrap element provided');
        return;
      }
      const statusEl = wrapElement.querySelector('#loanAppStatus');
      try {
        const sid = await ensureSession();

        const getVal = (id) => {
          const el = wrapElement.querySelector(`#${id}`);
          const value = el ? (el.value || '') : '';
          console.log(`[LoanApp] getVal('${id}') = "${value}"`);
          return value;
        };
        const getChecked = (id) => {
          const el = wrapElement.querySelector(`#${id}`);
          const checked = !!(el && el.checked);
          console.log(`[LoanApp] getChecked('${id}') = ${checked}`);
          return checked;
        };

        const phone = getVal('loanPhone');
        const phoneRaw = (phone || '').replace(/[^\d+]/g, '');
        if (phoneRaw) {
          let ok = false;
          if (phoneRaw.startsWith('+233')) {
            const digits = phoneRaw.replace(/\D/g, '');
            ok = digits.length === 12;
          } else if (phoneRaw.startsWith('233')) {
            ok = phoneRaw.replace(/\D/g, '').length === 12;
          } else if (phoneRaw.startsWith('0')) {
            ok = phoneRaw.replace(/\D/g, '').length === 10;
          }
          if (!ok) {
            if (statusEl) {
              statusEl.style.color = 'var(--danger, #c62828)';
              statusEl.textContent = 'Please enter a valid Ghana phone (e.g., 024XXXXXXX or +23324XXXXXXX).';
            }
            return;
          }
        }

        const payload = {
          sessionId: sid,
          fullName: getVal('loanFullName'),
          phoneNumber: getVal('loanPhone'),
          nationalIdNumber: getVal('loanNationalId'),
          accountNumber: getVal('loanAccountNumber'),
          employerName: getVal('loanEmployer'),
          position: getVal('loanPosition'),
          employmentType: getVal('loanEmploymentType'),
          lengthOfService: getVal('loanLengthService'),
          netMonthlySalary: getVal('loanNetSalary'),
          loanAmount: getVal('loanAmount'),
          loanPurpose: getVal('loanPurpose'),
          loanTenorMonths: getVal('loanTenor'),
          salaryDeductionConsent: getChecked('loanSalaryDeduction'),
          employerConfirmation: getChecked('loanEmployerConfirmation'),
          borrowerDeclaration: getChecked('loanBorrowerDeclaration')
        };

        console.log('[LoanApp] Payload being sent:', JSON.stringify(payload, null, 2));

        if (statusEl) {
          statusEl.style.color = 'var(--gray-600)';
          statusEl.textContent = 'Submitting…';
        }

        const resp = await fetch('/api/loan-application', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json().catch(() => ({}));

        if (resp.ok && data?.ok) {
          try { localStorage.removeItem('loanApplicationDraft'); } catch {}
          addMsg('assistant', `✓ Thank you. Your loan application has been submitted successfully.\n\nReference Number: ${data.applicationId}\nMonthly Instalment: GHS ${data.monthlyInstalment?.toFixed(2) || 'N/A'}\n\nYou will be contacted shortly for verification.`);
          
          // Remove the form after successful submission
          setTimeout(() => {
            wrapElement.remove();
          }, 1500);
          
          if (statusEl) {
            statusEl.style.color = 'var(--success, #2e7d32)';
            statusEl.innerHTML = '<i class="fa fa-check-circle"></i> Submitted successfully! Closing form...';
          }
          return;
        }

        if (statusEl) {
          statusEl.style.color = 'var(--danger, #c62828)';
          statusEl.textContent = data?.error ? `Error: ${data.error}` : 'Sorry, something went wrong.';
        }
      } catch (e) {
        if (statusEl) {
          statusEl.style.color = 'var(--danger, #c62828)';
          statusEl.textContent = 'Network error submitting application.';
        }
      }
    }

            specimenSignatureAcknowledged: readChecked('accSpecimenSignature'),
            customerDeclaration: readChecked('accCustomerDeclaration'),
            termsAccepted: readChecked('accTermsAccepted'),
            dataProcessingConsent: readChecked('accDataConsent')
          };
          localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
        } catch {}
      };

      wrap.addEventListener('input', persistDraft);
      wrap.addEventListener('change', persistDraft);
    }

    async function submitAccountOpening(wrapElement) {
      if (!wrapElement) {
        console.error('[AccountOpening] No wrap element provided');
        return;
      }
      const statusEl = wrapElement.querySelector('#accStatus');
      try {
        const sid = await ensureSession();

        const getVal = (id) => {
          const el = wrapElement.querySelector(`#${id}`);
          const value = el ? (el.value || '') : '';
          console.log(`[AccountOpening] getVal('${id}') = "${value}"`);
          return value;
        };
        const getChecked = (id) => {
          const el = wrapElement.querySelector(`#${id}`);
          const checked = !!(el && el.checked);
          console.log(`[AccountOpening] getChecked('${id}') = ${checked}`);
          return checked;
        };

        const payload = {
          sessionId: sid,
          fullName: getVal('accFullName'),
          dateOfBirth: getVal('accDateOfBirth'),
          gender: getVal('accGender'),
          maritalStatus: getVal('accMaritalStatus'),
          phoneNumber: getVal('accPhone'),
          email: getVal('accEmail'),
          residentialAddress: getVal('accResidentialAddress'),
          digitalAddress: getVal('accDigitalAddress'),
          postalAddress: getVal('accPostalAddress'),
          ghanaCardNumber: getVal('accGhanaCard'),
          occupation: getVal('accOccupation'),
          employerName: getVal('accEmployer'),
          monthlyIncome: getVal('accMonthlyIncome'),
          sourceOfFunds: getVal('accSourceOfFunds'),
          accountType: getVal('accAccountType'),
          modeOfOperation: getVal('accModeOfOperation'),
          initialDeposit: getVal('accInitialDeposit'),
          nextOfKinName: getVal('accNextOfKinName'),
          nextOfKinRelationship: getVal('accNextOfKinRelationship'),
          nextOfKinPhone: getVal('accNextOfKinPhone'),
          specimenSignatureAcknowledged: getChecked('accSpecimenSignature'),
          customerDeclaration: getChecked('accCustomerDeclaration'),
          termsAccepted: getChecked('accTermsAccepted'),
          dataProcessingConsent: getChecked('accDataConsent')
        };

        console.log('[AccountOpening] Payload being sent:', JSON.stringify(payload, null, 2));

        if (statusEl) {
          statusEl.style.color = 'var(--gray-600)';
          statusEl.textContent = 'Submitting…';
        }

        const resp = await fetch('/api/account-opening', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        console.log('[AccountOpening] Response status:', resp.status, resp.statusText);
        
        const data = await resp.json().catch((e) => {
          console.error('[AccountOpening] Failed to parse response:', e);
          return {};
        });
        
        console.log('[AccountOpening] Response data:', data);

        if (resp.ok && data?.ok) {
          try { localStorage.removeItem('accountOpeningDraft'); } catch {}
          addMsg('assistant', `✓ Thank you! Your account opening application has been submitted successfully.\\n\\nApplication Reference: ${data.applicationId}\\n\\nOur team will contact you within 1-2 business days to complete the process. Please have your ID ready.`);
          
          setTimeout(() => {
            wrapElement.remove();
          }, 1500);
          
          if (statusEl) {
            statusEl.style.color = 'var(--success, #2e7d32)';
            statusEl.innerHTML = '<i class="fa fa-check-circle"></i> Submitted successfully! Closing form...';
          }
          return;
        }

        if (statusEl) {
          statusEl.style.color = 'var(--danger, #c62828)';
          const errorMessage = data?.error || 'Sorry, something went wrong.';
          statusEl.textContent = `Error: ${errorMessage}`;
          console.error('[AccountOpening] Submission failed:', errorMessage);
        }
      } catch (e) {
        console.error('[AccountOpening] Exception during submission:', e);
        if (statusEl) {
          statusEl.style.color = 'var(--danger, #c62828)';
          statusEl.textContent = 'Network error submitting application. Please check your connection.';
        }
      }
    }

    let userLocation = null; // Store user's location
    
    function requestLocationAutomatically() {
      const statusEl = document.getElementById('locationStatus');
      if (!statusEl) return;
      
      if (!navigator.geolocation) {
        statusEl.textContent = 'Location services not available. Using global routing.';
        statusEl.style.color = 'var(--gray-500)';
        return;
      }
      
      statusEl.textContent = 'Detecting your location for smart routing...';
      statusEl.style.color = 'var(--primary-color)';
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          statusEl.textContent = `✓ Location detected! Will route to your nearest branch.`;
          statusEl.style.color = 'var(--success, #2e7d32)';
        },
        (error) => {
          console.log('Location detection:', error.message);
          let errorMsg = '';
          switch(error.code) {
            case error.PERMISSION_DENIED:
              errorMsg = 'Location access not permitted. Using global routing.';
              break;
            case error.POSITION_UNAVAILABLE:
              errorMsg = 'Location unavailable. Using global routing.';
              break;
            case error.TIMEOUT:
              errorMsg = 'Location timeout. Using global routing.';
              break;
            default:
              errorMsg = 'Location detection failed. Using global routing.';
              break;
          }
          statusEl.textContent = errorMsg;
          statusEl.style.color = 'var(--gray-500)';
          userLocation = null;
        },
        {
          enableHighAccuracy: true,
          timeout: 5000,
          maximumAge: 300000 // 5 minutes
        }
      );
    }

    async function submitHandoverRequest() {
      const nameEl = document.getElementById('handoverName');
      const phoneEl = document.getElementById('handoverPhone');
      const msgEl = document.getElementById('handoverMsg');
  const name = nameEl ? (nameEl.value || '') : '';
  const phone = phoneEl ? (phoneEl.value || '') : '';
  const msg = msgEl ? (msgEl.value || '') : '';
      const statusEl = document.getElementById('handoverStatus');
      
      // Basic phone validation (Ghana): allow +233XXXXXXXXX or 0XXXXXXXXX; ignore spaces/dashes
      const phoneRaw = (phone || '').replace(/[^\d+]/g, '');
      if (phoneRaw) {
        let ok = false;
        if (phoneRaw.startsWith('+233')) {
          const digits = phoneRaw.replace(/\D/g, '');
          ok = digits.length === 12; // 233 + 9 digits
        } else if (phoneRaw.startsWith('233')) {
          ok = phoneRaw.replace(/\D/g, '').length === 12;
        } else if (phoneRaw.startsWith('0')) {
          const digits = phoneRaw.replace(/\D/g, '');
          ok = digits.length === 10; // 0 + 9 digits
        }
        if (!ok) {
          if (statusEl) {
            statusEl.style.color = 'var(--danger, #c62828)';
            statusEl.textContent = 'Please enter a valid Ghana phone (e.g., 024XXXXXXX or +23324XXXXXXX).';
          }
          return;
        }
      }
      
      try {
        const sid = await ensureSession();
  if (statusEl) statusEl.textContent = 'Submitting…';
        
        // Prepare request body with location if available
        const requestBody = { 
          sessionId: sid, 
          name, 
          phone, 
          message: msg 
        };
        
        if (userLocation) {
          requestBody.lat = userLocation.lat;
          requestBody.lng = userLocation.lng;
        }
        
        let resp = await fetch('/api/handover', { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify(requestBody) 
        });
        let data = await resp.json();
        
        // If session expired (e.g., server restart), create a fresh session and retry once
        if (resp.status === 404 && (data?.error || '').toLowerCase().includes('session not found')) {
          sessionId = null; // Clear the stale session ID
          const newSid = await ensureSession();
          requestBody.sessionId = newSid;
          resp = await fetch('/api/handover', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(requestBody) 
          });
          try { data = await resp.json(); } catch { data = undefined; }
        }
        
        if (resp.ok && data?.ok) {
          let successMsg = `Request received. Ticket: ${data.ticketId}.`;
          if (data.targetBranch) {
            successMsg += ` Routed to ${data.targetBranch} branch.`;
          }
          successMsg += ' An agent will contact you soon.';
          if (statusEl) {
            statusEl.textContent = successMsg;
            statusEl.style.color = 'var(--success, #2e7d32)';
          }
          return;
        }
        if (statusEl) {
          if (resp.status === 429) {
            statusEl.textContent = 'Too many requests. Please try again later.';
          } else {
            statusEl.textContent = data?.error ? `Error: ${data.error}` : 'Sorry, something went wrong.';
          }
          statusEl.style.color = 'var(--danger, #c62828)';
        }
      } catch (e) {
        if (statusEl) {
          statusEl.textContent = 'Network error submitting request.';
          statusEl.style.color = 'var(--danger, #c62828)';
        }
      }
    }

    function sendQuickMessage(message) {
      sendMessage(message);
    }

    // Auto-resize textarea
    input.addEventListener('input', function() {
      this.style.height = 'auto';
      const isMobile = window.innerWidth <= 768;
      const cap = isMobile ? 200 : 140;
      this.style.height = Math.min(this.scrollHeight, cap) + 'px';
    });

    // Handle enter key
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit'));
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await sendMessage();
    });

    async function callNearestBranch(payload) {
      try {
        const resp = await fetch('/api/nearest-branch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        if (data?.text) addMsg('assistant', data.text);
        else addMsg('assistant', 'Location received. Nearest branch lookup will be available soon.');
      } catch (e) {
        console.error('nearest error', e);
        addMsg('assistant', 'Sorry, I could not process the location right now. You can share a GhanaPost plus code (e.g., QQJG+P27).');
      }
    }

    useLocationBtn.addEventListener('click', async () => {
      if (!('geolocation' in navigator)) {
        addMsg('assistant', 'Geolocation is not supported by your browser. Please enter a GhanaPost plus code instead.');
        return;
      }
      addMsg('assistant', 'Requesting your location…');
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          await callNearestBranch({ lat: latitude, lng: longitude });
        },
        (err) => {
          console.error('geo error', err);
          addMsg('assistant', 'I could not access your location. You can enter a GhanaPost plus code instead.');
        },
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
      );
    });

  // Removed Plus Code map pin button per request

    // Hide "Send" text on smaller screens
    function adjustSendButton() {
        if (!sendButtonText) return; // Guard against null
        if (window.innerWidth <= 768) {
            sendButtonText.style.display = 'none';
        } else {
            sendButtonText.style.display = 'inline';
        }
    }

    window.addEventListener('resize', adjustSendButton);
    window.addEventListener('DOMContentLoaded', adjustSendButton);

    // Focus input on load
    input.focus();

    // Listen for parent visibility hints (optional)
    window.addEventListener('message', (e) => {
      try {
        const data = e?.data || {};
        if (!data || data.source !== 'akcb-chat-parent') return;
        if (data.type === 'setVisible' && data.visible) {
          // Focus input and scroll to bottom when parent opens chat
          input?.focus();
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      } catch {}
    });
  </script>
